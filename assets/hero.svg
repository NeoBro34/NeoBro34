<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Nurislom Khurramov — Full Stack, DevOps and AI Engineer">
<style>
.p{fill:#9BE9FF;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:translateY(0)}50%{opacity:.9;transform:translateY(-10px)}}
.b1{animation:d1 16s ease-in-out infinite alternate}
.b2{animation:d2 19s ease-in-out infinite alternate}
.b3{animation:d3 22s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(180px,60px) scale(1.15)}}
@keyframes d2{to{transform:translate(-200px,-40px) scale(.9)}}
@keyframes d3{to{transform:translate(120px,-70px) scale(1.2)}}
.ring{transform-origin:600px 190px;animation:spin 40s linear infinite}
.ring2{transform-origin:600px 190px;animation:spin 60s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.chip{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.chipt{font:600 13px 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;fill:#CFFAFE;letter-spacing:1.5px}
.name{font:800 76px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-1px}
.tag{font:500 15px 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;fill:#00F7FF;letter-spacing:4px}
.sub{font:400 24px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#C9D1D9}
.st{font:500 14px 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;fill:#8B949E}
.dot{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up,.chip{opacity:1!important}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080D"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#00F7FF"/><stop offset=".35" stop-color="#FFFFFF"/><stop offset=".65" stop-color="#8B5CF6"/><stop offset="1" stop-color="#00F7FF"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#1F6F8B" stroke-opacity=".35" stroke-width="1"/>
    <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 44" dur="3.5s" repeatCount="indefinite"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
  <mask id="gm"><rect width="1200" height="440" fill="url(#fade)"/></mask>
  <clipPath id="clip"><rect width="1200" height="440" rx="22"/></clipPath>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F7FF" stop-opacity=".6"/><stop offset=".5" stop-color="#8B5CF6" stop-opacity=".2"/><stop offset="1" stop-color="#00F7FF" stop-opacity=".6"/></linearGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="440" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".55">
    <circle class="b1" cx="260" cy="120" r="190" fill="#00F7FF" opacity=".55"/>
    <circle class="b2" cx="950" cy="160" r="210" fill="#8B5CF6" opacity=".6"/>
    <circle class="b3" cx="620" cy="420" r="200" fill="#3B82F6" opacity=".5"/>
  </g>
  <rect width="1200" height="440" fill="url(#grid)" mask="url(#gm)"/>
  <g opacity=".5"><circle class="p" cx="1103" cy="202" r="1" style="animation-duration:8.2s;animation-delay:-5.4s"/><circle class="p" cx="816" cy="206" r="1" style="animation-duration:6.1s;animation-delay:-1.8s"/><circle class="p" cx="213" cy="319" r="1.2" style="animation-duration:4.5s;animation-delay:-2.1s"/><circle class="p" cx="23" cy="417" r="1.2" style="animation-duration:7.8s;animation-delay:-0.5s"/><circle class="p" cx="145" cy="209" r="1.6" style="animation-duration:7.7s;animation-delay:-4.2s"/><circle class="p" cx="142" cy="218" r="1.2" style="animation-duration:6.9s;animation-delay:-3.8s"/><circle class="p" cx="617" cy="215" r="1.6" style="animation-duration:5.1s;animation-delay:-2.7s"/><circle class="p" cx="387" cy="330" r="1.2" style="animation-duration:6.9s;animation-delay:-2.4s"/><circle class="p" cx="888" cy="140" r="1.2" style="animation-duration:7.4s;animation-delay:-0.7s"/><circle class="p" cx="173" cy="247" r="1.6" style="animation-duration:6.1s;animation-delay:-3.5s"/><circle class="p" cx="425" cy="109" r="2" style="animation-duration:7.9s;animation-delay:-5.4s"/><circle class="p" cx="943" cy="66" r="2" style="animation-duration:6.1s;animation-delay:-2.8s"/><circle class="p" cx="288" cy="247" r="1.6" style="animation-duration:4.7s;animation-delay:-0.9s"/><circle class="p" cx="657" cy="55" r="1.6" style="animation-duration:6.6s;animation-delay:-3.5s"/><circle class="p" cx="628" cy="228" r="1.2" style="animation-duration:6.0s;animation-delay:-5.1s"/><circle class="p" cx="1108" cy="390" r="1.6" style="animation-duration:8.8s;animation-delay:-3.7s"/><circle class="p" cx="952" cy="53" r="1" style="animation-duration:7.7s;animation-delay:-2.0s"/><circle class="p" cx="677" cy="108" r="1.2" style="animation-duration:7.7s;animation-delay:-2.1s"/><circle class="p" cx="764" cy="359" r="1.6" style="animation-duration:4.0s;animation-delay:-4.3s"/><circle class="p" cx="552" cy="282" r="1" style="animation-duration:4.8s;animation-delay:-0.7s"/><circle class="p" cx="558" cy="63" r="2" style="animation-duration:7.8s;animation-delay:-1.5s"/><circle class="p" cx="335" cy="259" r="1.2" style="animation-duration:8.9s;animation-delay:-2.2s"/><circle class="p" cx="791" cy="95" r="1" style="animation-duration:6.3s;animation-delay:-3.6s"/><circle class="p" cx="284" cy="156" r="2" style="animation-duration:7.5s;animation-delay:-5.1s"/><circle class="p" cx="1132" cy="256" r="1" style="animation-duration:6.0s;animation-delay:-2.8s"/><circle class="p" cx="1030" cy="342" r="2" style="animation-duration:4.8s;animation-delay:-0.5s"/><circle class="p" cx="840" cy="286" r="1.6" style="animation-duration:8.4s;animation-delay:-1.0s"/><circle class="p" cx="1079" cy="252" r="2" style="animation-duration:5.1s;animation-delay:-5.3s"/><circle class="p" cx="656" cy="247" r="1.6" style="animation-duration:7.8s;animation-delay:-3.7s"/><circle class="p" cx="266" cy="362" r="1.2" style="animation-duration:4.8s;animation-delay:-3.0s"/><circle class="p" cx="648" cy="363" r="1" style="animation-duration:5.4s;animation-delay:-5.3s"/><circle class="p" cx="942" cy="268" r="2" style="animation-duration:8.3s;animation-delay:-1.8s"/><circle class="p" cx="1111" cy="286" r="1.6" style="animation-duration:8.8s;animation-delay:-5.6s"/><circle class="p" cx="718" cy="419" r="1.6" style="animation-duration:7.8s;animation-delay:-5.9s"/><circle class="p" cx="743" cy="369" r="1" style="animation-duration:5.6s;animation-delay:-5.6s"/><circle class="p" cx="803" cy="278" r="2" style="animation-duration:4.2s;animation-delay:-0.4s"/><circle class="p" cx="223" cy="315" r="2" style="animation-duration:8.3s;animation-delay:-5.7s"/><circle class="p" cx="554" cy="242" r="1" style="animation-duration:4.8s;animation-delay:-2.7s"/></g>
  <g fill="none" stroke="#00F7FF" stroke-opacity=".18">
    <circle class="ring" cx="600" cy="190" r="250" stroke-dasharray="2 14" stroke-width="2"/>
    <circle class="ring2" cx="600" cy="190" r="300" stroke-dasharray="80 40 6 40" stroke-opacity=".1"/>
  </g>
  <text x="600" y="98" text-anchor="middle" class="tag up" style="animation-delay:.1s">&lt;HELLO WORLD /&gt;<tspan class="cur">_</tspan></text>
  <text x="600" y="190" text-anchor="middle" class="name up" fill="url(#tg)" filter="url(#glow)" style="animation-delay:.35s">Nurislom Khurramov</text>
  <text x="600" y="246" text-anchor="middle" class="sub up" style="animation-delay:.8s">Full Stack  ·  DevOps  ·  AI Engineer — building SaaS that runs real businesses</text>
  <g class="chip" style="animation-delay:1.30s">
  <rect x="261.6" y="300" width="110.8" height="34" rx="17" fill="#0B1A24" stroke="#00F7FF" stroke-opacity=".35"/>
  <text x="317.0" y="322" text-anchor="middle" class="chipt">4+ YEARS</text></g><g class="chip" style="animation-delay:1.42s">
  <rect x="384.4" y="300" width="101.2" height="34" rx="17" fill="#0B1A24" stroke="#00F7FF" stroke-opacity=".35"/>
  <text x="435.0" y="322" text-anchor="middle" class="chipt">NEXT.JS</text></g><g class="chip" style="animation-delay:1.54s">
  <rect x="497.6" y="300" width="91.6" height="34" rx="17" fill="#0B1A24" stroke="#00F7FF" stroke-opacity=".35"/>
  <text x="543.4" y="322" text-anchor="middle" class="chipt">NESTJS</text></g><g class="chip" style="animation-delay:1.66s">
  <rect x="601.2" y="300" width="101.2" height="34" rx="17" fill="#0B1A24" stroke="#00F7FF" stroke-opacity=".35"/>
  <text x="651.8" y="322" text-anchor="middle" class="chipt">FASTAPI</text></g><g class="chip" style="animation-delay:1.78s">
  <rect x="714.4" y="300" width="91.6" height="34" rx="17" fill="#0B1A24" stroke="#00F7FF" stroke-opacity=".35"/>
  <text x="760.2" y="322" text-anchor="middle" class="chipt">DEVOPS</text></g><g class="chip" style="animation-delay:1.90s">
  <rect x="818.0" y="300" width="120.4" height="34" rx="17" fill="#0B1A24" stroke="#00F7FF" stroke-opacity=".35"/>
  <text x="878.2" y="322" text-anchor="middle" class="chipt">AI AGENTS</text></g>
  <g class="up" style="animation-delay:2.2s">
    <circle cx="486" cy="384" r="5" fill="#22C55E"/><circle class="dot" cx="486" cy="384" r="5" fill="#22C55E"/>
    <text x="500" y="389" class="st">Open to collaboration  ·  Seoul, KR 🇰🇷  ·  from UZ 🇺🇿</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="439" rx="22" fill="none" stroke="url(#edge)"/>
</svg>